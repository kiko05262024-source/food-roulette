<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffd9e8">
  <title>好朋友就要搓一顿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="deco deco-a"></div>
    <div class="deco deco-b"></div>
    <div class="deco deco-c"></div>
    <div class="deco deco-d"></div>

    <header class="topbar">
      <h1>好朋友<br>就要搓一顿</h1>
      <p>今天吃森莫捏？</p>
    </header>

    <section class="game">
      <div class="wheel-wrap">
        <div class="wheel-stage" id="wheelStage">
          <canvas id="wheel" width="600" height="600"></canvas>
          <div id="wheelItems" class="wheel-items" aria-hidden="true"></div>
        </div>
        <div class="pointer">▼</div>
        <button id="goBtn" class="go-btn">GO</button>
      </div>

      <div class="hint">点一下 GO，让命运替你做决定！</div>
    </section>

    <div class="rabbit-scene" aria-hidden="true">
      <svg class="rabbit" viewBox="0 0 260 150" role="img">
        <path class="rabbit-line" d="M82 101c-8-19-7-45 7-61 8-10 22-15 38-14 17 1 31 10 38 24 7 14 6 34-1 51"/>
        <path class="rabbit-fill" d="M94 35C88 18 92 4 101 5c10 1 14 17 14 29 8-7 20-11 32-8 3-13 8-26 17-24 10 3 6 23 1 34 8 8 12 19 12 31 0 22-17 39-43 39-27 0-43-15-43-37 0-14 4-25 13-34Z"/>
        <path class="rabbit-ear" d="M102 33c-8-15-6-25-1-26 7-1 12 12 13 24M165 36c4-16 10-25 16-22 7 4 0 20-4 29"/>
        <circle cx="122" cy="64" r="4" class="rabbit-face"/>
        <circle cx="151" cy="64" r="4" class="rabbit-face"/>
        <path d="M132 76c4 4 8 4 12 0M138 73v7" class="rabbit-face"/>
        <path d="M97 86c-20 2-28 7-37 14M177 86c18 1 27 7 37 14" class="rabbit-line"/>
        <path d="M54 89l-7 25m7-17-12-8m12 8 12-8M207 89l7 25m-7-17-12-8m12 8 12-8" class="rabbit-utensil"/>
        <path d="M95 108c18 7 57 8 75-1" class="rabbit-line"/>
      </svg>
      <div class="rabbit-copy">和朋友<br>一起吃更香！</div>
    </div>

    <button id="editMenuBtn" class="edit-menu-btn">✎ 编辑菜单</button>
    <div class="bottom-wave"></div>
  </main>

  <!-- 结果弹窗 -->
  <div id="resultModal" class="modal hidden">
    <div class="modal-card">
      <div class="sparkle">🎉</div>
      <h2>うわー美味しそう！</h2>
      <div id="resultEmoji" class="result-emoji">🍖</div>
      <div id="resultName" class="result-name">烤肉！</div>
      <p class="result-joke">じゃ、行きましょう</p>

      <button id="againBtn" class="primary-btn">↻ 再来一次</button>
      <button id="homeBtn" class="secondary-btn">⌂ 返回首页</button>
    </div>
  </div>

  <!-- 编辑菜单弹窗 -->
  <div id="editModal" class="modal hidden">
    <div class="edit-card">
      <div class="edit-head">
        <button id="closeEditBtn" class="back-btn">‹</button>
        <h2>编辑菜单</h2>
      </div>

      <p class="edit-tip">编辑你们今天的选择吧～<br>图标和文字都可以改哦！</p>

      <div id="foodInputs" class="food-inputs"></div>

      <button id="saveBtn" class="primary-btn">▣ 保存</button>
    </div>
  </div>

  <div id="toast" class="toast hidden">保存成功！</div>

  <script src="script.js"></script>
</body>
</html>
