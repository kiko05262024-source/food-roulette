<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd9e5">
<title>走、搓一顿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <div class="decor d1">♡</div><div class="decor d2">☆</div><div class="decor d3">✦</div><div class="decor d4">♡</div><div class="decor d5">☆</div>
  <header>
    <h1><span>🐰</span>走、搓一顿<span>🐰</span></h1>
    <div class="subtitle">今天吃森莫捏？</div>
  </header>

  <section class="wheel-zone">
    <div class="pointer">▲</div>
    <div id="rotator" class="rotator">
      <canvas id="wheel" width="720" height="720"></canvas>
      <div id="labels" class="labels"></div>
    </div>
    <button id="go" class="go">GO</button>
  </section>

  <section class="bunny-area">
    <img src="bunny.png" alt="" class="bunny">
    <div class="play">あそぼー♡</div>
  </section>
  <button id="editBtn" class="edit-btn">✎ 编辑菜单</button>
</main>

<div id="result" class="overlay hidden">
  <div class="result-card">
    <div class="confetti">✦　♡　✧　☆　♡　✦</div>
    <img src="celebrate-bunny.png" alt="" class="celebrate-bunny">
    <div class="jp-title">うわーおいしそう</div>
    <div id="resultEmoji" class="result-emoji">🍣</div>
    <div id="resultName" class="result-name">寿司</div>
    <div class="jp-copy">じゃ、行きましょう</div>
    <div class="result-actions">
      <button id="again" class="again">再来一次</button>
      <button id="home" class="home">返回首页</button>
    </div>
  </div>
</div>

<div id="editor" class="overlay hidden">
  <div class="editor-card">
    <button id="closeEditor" class="x">×</button>
    <h2>编辑菜单</h2>
    <p>图标和文字都可以改哦～</p>
    <div id="inputs"></div>
    <button id="save" class="save">保存</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
