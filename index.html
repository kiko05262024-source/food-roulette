<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffd9e8">
  <title>好朋友就要搓一顿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>好朋友就要搓一顿</h1>
        <p>不知道吃什么？那就交给命运吧！</p>
      </div>
      <button id="editBtn" class="icon-btn" aria-label="编辑菜单">⚙</button>
    </header>

    <section class="game">
      <div class="wheel-wrap">
        <div class="pointer">▼</div>
        <canvas id="wheel" width="600" height="600"></canvas>
      </div>

      <div class="hint">点一下 GO，让命运替你做决定！</div>

      <button id="goBtn" class="go-btn">GO</button>
    </section>

    <button id="editMenuBtn" class="edit-menu-btn">✎ 编辑菜单</button>
  </main>

  <!-- 结果弹窗 -->
  <div id="resultModal" class="modal hidden">
    <div class="modal-card">
      <div class="sparkle">🎉</div>
      <h2>命运决定了！</h2>
      <div id="resultEmoji" class="result-emoji">🍖</div>
      <p class="result-label">今天吃</p>
      <div id="resultName" class="result-name">烤肉！</div>
      <p class="result-joke">命运都这么说了，还能怎么办。</p>

      <button id="againBtn" class="primary-btn">↻ 再来一次</button>
      <button id="homeBtn" class="secondary-btn">⌂ 返回首页</button>
    </div>
  </div>

  <!-- 编辑菜单弹窗 -->
  <div id="editModal" class="modal hidden">
    <div class="edit-card">
      <div class="edit-head">
        <button id="closeEditBtn" class="back-btn">‹</button>
        <h2>编辑菜单</h2>
      </div>

      <p class="edit-tip">编辑你们今天的选择吧～<br>最多 6 个选项</p>

      <div id="foodInputs" class="food-inputs"></div>

      <button id="saveBtn" class="primary-btn">▣ 保存</button>
    </div>
  </div>

  <div id="toast" class="toast hidden">保存成功！</div>

  <script src="script.js"></script>
</body>
</html>
